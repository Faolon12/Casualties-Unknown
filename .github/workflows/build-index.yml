# Keeps data/resources.json up to date when you add, edit or remove things in resources/ yourself.
name: Rebuild resource list
on:
  push:
    branches: [main]
    paths: ['resources/**', 'data/types.json', 'tools/build_index.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hub-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_index.py
      - run: |
          git config user.name "luna-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.json
          git commit -m "Rebuild resource list" || exit 0
          git pull --rebase
          git push
